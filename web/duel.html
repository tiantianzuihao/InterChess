<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InterChess · 人机博弈</title><link rel="stylesheet" href="duel.css?v=3"><link rel="stylesheet" href="play-layout.css?v=5"></head><body class="duel-page"><main><nav><a href="/">首页</a><a href="practice.html">残局练习</a><a class="active" aria-current="page" href="duel.html">人机博弈</a></nav>
<section id="setup"><p class="muted">本地 Stockfish · 标准国际象棋</p><h1>人机对弈</h1><form id="newGame"><fieldset class="time-settings"><legend>对局时间</legend><div class="choices time-tabs"><label><input type="radio" name="timing" value="unlimited" checked><span>无限制</span><small>慢慢想，轻松练</small></label><label><input type="radio" name="timing" value="timed"><span>限时对局</span><small>跟着棋钟来挑战</small></label></div><p id="unlimitedHint" class="time-note">不设倒计时，想好了再落子。</p><div id="timeFields" hidden><div class="time-inputs"><label class="time-input" for="minutes"><span>每方时间</span><div><input id="minutes" type="number" min="1" max="180" value="5" required><span>分钟</span></div></label><span class="time-plus" aria-hidden="true">＋</span><label class="time-input" for="increment"><span>每步加时</span><div><input id="increment" type="number" min="0" max="60" value="3" required><span>秒</span></div></label></div><div class="preset-heading"><span>快捷选择</span><span id="timeSummary" aria-live="polite"></span></div><div id="presets" aria-label="常用时间组合"></div><p class="time-note">例如 5 + 3：每方 5 分钟，每走一步加 3 秒。</p></div></fieldset><fieldset><legend>难度等级</legend><div id="levels" class="choices"></div><p class="muted">1 级最轻松，8 级最强。可随时重新开局调整。</p></fieldset><fieldset><legend>执棋方</legend><div class="choices"><label><input type="radio" name="color" value="white" checked>♔ 白方</label><label><input type="radio" name="color" value="random">随机</label><label><input type="radio" name="color" value="black">♚ 黑方</label></div></fieldset><p id="error" role="alert"></p><button class="primary" id="start" type="submit">开始对弈</button></form></section>
<section id="game" class="play-layout" hidden><section class="play-tools"><h1>人机博弈</h1><div class="player-cards"><div class="clock" id="opponentClock"><span id="opponentLabel"></span><strong id="opponentTime"></strong><div id="opponentCaptures" class="player-captures" aria-label="电脑吃掉的棋子" hidden></div></div><div class="clock" id="humanClock"><span id="humanLabel"></span><strong id="humanTime"></strong><div id="humanCaptures" class="player-captures" aria-label="你吃掉的棋子" hidden></div></div></div><div class="controls"><button id="newSettings">新对局</button><button id="resign">认输</button><button id="claim" hidden>申请和棋</button><button id="soundToggle" type="button" aria-label="走棋音效">声音：开</button></div></section><section class="board-stage"><div id="board" aria-label="人机棋盘"></div></section><aside class="play-info"><h2 id="title"></h2><p id="status" role="status"></p><p id="gameError" role="alert"></p><button id="retry" hidden>重试连接</button><div id="history"></div><p class="muted">刷新后可继续本局。限时对局切换页面仍会计时；重启本地服务会结束对局。</p></aside></section>
<dialog id="resultDialog" aria-labelledby="resultTitle" aria-describedby="resultReason"><p id="resultPlayer"></p><h2 id="resultTitle"></h2><p id="resultReason"></p><div class="result-actions"><button id="resultBoard" type="button" autofocus>查看棋盘</button><button id="resultNew" class="primary" type="button">再来一局</button></div></dialog>
<dialog id="promotion"><p>兵升变为什么棋子？</p><button data-piece="q">后</button><button data-piece="r">车</button><button data-piece="b">象</button><button data-piece="n">马</button><button id="cancelPromotion">取消</button></dialog>
</main><script src="practice-sound.js?v=1"></script><script src="duel.js?v=5"></script></body></html>
