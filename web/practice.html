<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InterChess · 残局练习</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#243a30;font:16px 'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1040px;margin:32px auto;padding:20px}h1{margin:8px 0}p{line-height:1.7}.muted{color:#68776d;font-size:14px}button,select{font:inherit;padding:10px;border:1px solid #b9cbbd;border-radius:8px;background:white;color:#243a30;cursor:pointer}button:disabled{opacity:.5;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.layout{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(90vw,520px);aspect-ratio:1;border:3px solid #647c65}#board button{position:relative;border:0;border-radius:0;padding:0;font:clamp(25px,6vw,48px) 'Segoe UI Symbol','DejaVu Sans',serif;color:#121b16;background:#eee8d7;aspect-ratio:1}#board button.dark{background:#94aa91}#board button.selected{box-shadow:inset 0 0 0 4px #d39829}#board button.target:after{content:'';position:absolute;width:20%;height:20%;border-radius:50%;background:#315e4780;left:40%;top:40%}#board small{position:absolute;bottom:2px;left:3px;font:10px sans-serif}aside{flex:1;min-width:260px}#message{padding:16px;border-radius:10px;background:#e6eedf;min-height:80px}#answer{padding:16px;background:white;border-radius:10px;overflow-wrap:anywhere}#moves{overflow-wrap:anywhere}a{color:#296449}dialog{border:1px solid #94aa91;border-radius:12px;max-width:90vw}dialog button{margin:6px}[hidden]{display:none!important}</style></head><body><main>
<p class="muted">InterChess · 本地练习</p><h1>来解一道残局</h1><p class="muted">点击自己的棋子，再点目标格。按书中答案练习，电脑自动走书中应手。</p>
<div class="controls"><select id="chapter" aria-label="章节"></select><select id="puzzle" aria-label="题号"></select><button id="prev">上一题</button><button id="next">下一题</button></div>
<div class="layout"><div id="board" aria-label="练习棋盘"></div><aside><h2 id="title"></h2><p id="side"></p><p id="message" role="status" aria-live="polite">正在载入题库…</p><p id="moves"></p><div class="controls"><button id="restart">重新开始</button><button id="reveal">查看答案</button></div><div id="answer" hidden></div><p class="muted">未收录的走法不一定是错棋，会提示需要进一步分析。完成书中变化不一定代表已经将死。</p><p><a href="/">扫描工作台</a></p></aside></div>
<dialog id="promotion"><p>兵升变为什么棋子？</p><button data-piece="q">后</button><button data-piece="r">车</button><button data-piece="b">象</button><button data-piece="n">马</button><button id="cancelPromotion">取消</button></dialog>
</main><script src="practice.js"></script></body></html>
