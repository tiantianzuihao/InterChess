<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InterChess · 残局练习</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#243a30;font:16px 'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1040px;margin:32px auto;padding:20px}h1{margin:8px 0}p{line-height:1.7}.muted{color:#68776d;font-size:14px}button,select{font:inherit;padding:10px;border:1px solid #b9cbbd;border-radius:8px;background:white;color:#243a30;cursor:pointer}button:disabled{opacity:.5;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.layout{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(90vw,520px);aspect-ratio:1;border:3px solid #647c65}#board button{position:relative;border:0;border-radius:0;padding:0;font:clamp(25px,6vw,48px) 'Segoe UI Symbol','DejaVu Sans',serif;color:#121b16;background:#eee8d7;aspect-ratio:1}#board button.dark{background:#94aa91}#board button.selected{box-shadow:inset 0 0 0 4px #d39829}#board button.target:after{content:'';position:absolute;width:20%;height:20%;border-radius:50%;background:#315e4780;left:40%;top:40%}#board small{position:absolute;bottom:2px;left:3px;font:10px sans-serif}aside{flex:1;min-width:260px}#message{padding:16px;border-radius:10px;background:#e6eedf;min-height:80px}#answer{padding:16px;background:white;border-radius:10px;overflow-wrap:anywhere}#moves{overflow-wrap:anywhere}a{color:#296449}dialog{border:1px solid #94aa91;border-radius:12px;max-width:90vw}dialog button{margin:6px}[hidden]{display:none!important}#board button.computer-last{background:#c4d66b;box-shadow:inset 0 0 0 3px #82b51e}#board button.dark.computer-last{background:#98b34c}#board button.computer-last.selected{box-shadow:inset 0 0 0 4px #d39829}#board button.capture-target:before{content:'';position:absolute;inset:4px;pointer-events:none;background:linear-gradient(#df514b,#df514b) top left/28% 4px no-repeat,linear-gradient(#df514b,#df514b) top left/4px 28% no-repeat,linear-gradient(#df514b,#df514b) top right/28% 4px no-repeat,linear-gradient(#df514b,#df514b) top right/4px 28% no-repeat,linear-gradient(#df514b,#df514b) bottom left/28% 4px no-repeat,linear-gradient(#df514b,#df514b) bottom left/4px 28% no-repeat,linear-gradient(#df514b,#df514b) bottom right/28% 4px no-repeat,linear-gradient(#df514b,#df514b) bottom right/4px 28% no-repeat} #board button.king-check{background-image:radial-gradient(ellipse at center,rgba(255,30,20,.95) 0%,rgba(255,45,25,.72) 32%,rgba(255,50,30,.25) 55%,transparent 73%)}.captures{background:#fff;border-radius:9px;padding:12px;font-size:13px}.captures div{display:flex;align-items:center;gap:14px;min-height:38px}.captures span{font:28px "Segoe UI Symbol",serif;overflow-wrap:anywhere} .move-badge{position:absolute;right:-4px;top:-5px;width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none;box-shadow:0 1px 4px #0004;font: bold 23px "Segoe UI Symbol",sans-serif;color:white}.mate-badge{background:#ee5260}.capture-badge{background:#317eb8;border:1px solid white;overflow:hidden}.capture-badge::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:1.5px;background:#fff;box-shadow:0 0 1px #317eb8;transform:translate(-50%,-50%) rotate(-45deg);pointer-events:none}#board{overflow:visible} .thinking-dots{display:inline-block;white-space:nowrap}.thinking-dots span{animation:thinking-dot 1.2s infinite;opacity:0}.thinking-dots span:nth-child(2){animation-delay:.2s}.thinking-dots span:nth-child(3){animation-delay:.4s}@keyframes thinking-dot{0%,20%{opacity:0}40%,85%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.thinking-dots span{animation:none;opacity:1}}</style><link rel="stylesheet" href="play-layout.css?v=2"></head><body class="practice-page"><main><nav style="display:flex;gap:20px;margin-bottom:20px"><a href="/">首页</a><strong>残局练习</strong><a href="/duel.html">人机博弈</a></nav>
<div class="play-layout"><section class="play-tools"><p class="muted">InterChess · 本地练习</p><h1>来解一道残局</h1><p class="muted">点击自己的棋子，再点目标格。按书中答案练习，电脑自动走书中应手。绿色格子标记电脑上一步，红色四角表示可吃子。</p>
<div class="controls"><select id="chapter" aria-label="章节"></select><select id="puzzle" aria-label="题号"></select><button id="prev">上一题</button><button id="next">下一题</button><button id="restart">重做</button><button id="soundToggle" type="button" aria-label="走棋音效" aria-pressed="true">声音：开</button></div>
</section><section class="board-stage"><div id="board" aria-label="练习棋盘"></div><div id="boardRetry" role="status" hidden>再想一想</div></section><aside class="play-info"><h2 id="title"></h2><p id="side"></p><div id="message" aria-live="polite"></div><p id="feedback" class="muted" role="status">正在载入题库…</p><div class="controls"><button id="reveal">查看答案</button></div><div id="answer" hidden></div><p class="muted">未收录的走法不一定是错棋，会提示需要进一步分析。完成书中变化不一定代表已经将死。</p><p><a href="/scanner.html">扫描工作台</a></p></aside></div>
