 Rf8+ Kd7 R1f7#", "Qxf8+! Kxf8 Rxf7+ Kg8 Rf8+ Kg7 R1f7#"]}, {"number": 373, "turn": "黑方先走", "notes": [], "lines": ["Qxg2+! Kxg2 Rxf2+ Kg1 Rb1#"]}, {"number": 374, "turn": "黑方先走", "notes": ["原书另称白方走王则 Re1#；具体应手未逐一列出，练习收录 fxg3 主线。"], "lines": ["Qg3+! fxg3 Re1+ Kf2 R8e2#"]}, {"number": 375, "turn": "白方先走", "notes": [], "lines": ["Bh6! Bxh6 Rg7+ Kh8 Rxh6#"]}, {"number": 376, "turn": "白方先走", "notes": [], "lines": ["Qxf8+! Kxf8 Rh8+ Ke7 Rg7+ Kxe6 Rxh6#"]}, {"number": 377, "turn": "白方先走", "notes": [], "lines": ["Qxh5+! Kxh5 Rh1+ Bh4 Rg5+ Kh6 Rxh4#"]}, {"number": 378, "turn": "黑方先走", "notes": [], "lines": ["Qxh4+! Kxh4 Be7+ Kh3 Rh8+ Qh5 Rxh5#"]}, {"number": 379, "turn": "白方先走", "notes": [], "lines": ["Qxg6+! fxg6 Rg7+ Kh8 Rh7+ Kg8 Rbg7#"]}, {"number": 380, "turn": "黑方先走", "notes": ["Qh2+ 备选分支原书停在 Qxg2+，说明也可将杀但较慢。"], "lines": ["Qh1+! Kf2 Qxg2+! Kxg2 Rh2+ Kf1 Rh1+ Ke2 R8h2#", "Qh1+! Bxh1 Rxh1+ Kf2 R8h2#", "Qh2+ Kf1 Qh1+! Kf2 Qxg2+!"]}, {"number": 381, "turn": "白方先走", "notes": [], "lines": ["Qd7+ Kh6 Qh7+! Kxh7 R1d7+ Kh6 Rh8#"]}, {"number": 382, "turn": "白方先走", "notes": [], "lines": ["Qh4+ g5 Qh6+ Rg6 Qxg6+! Kxg6 R1h6#", "Qh4+ Ke6 Qe7#"]}, {"number": 383, "turn": "白方先走", "notes": [], "lines": ["Nc6+! Rxc6 Rd7+ Kf8 Rf7+ Ke8 Rg8#", "Nc6+! Ke8 Rd8#", "Nc6+! Rxc6 Rd7+ Ke8 Rg8#"]}, {"number": 384, "turn": "黑方先走", "notes": ["原书主线停在 Nxf3+，说明白方无论如何应将均被 Rh6#；保留省略，未补造白方应手。"], "lines": ["Qxh2+! Kxh2 Nxf3+!", "Qxh2+! Kf1 Qh1+ Ke2 Rxg2#", "Qxh2+! Kf2 Rxg2+ Ke1 Qh1#"]}];const s=document.getElementById('select');for(const p of data){const o=document.createElement('option');o.value=p.number;o.textContent='第 '+p.number+' 题';s.append(o)}function show(){const p=data.find(p=>p.number===+s.value);document.getElementById('photo').src=p.number+'.jpg';document.getElementById('board').src=p.number+'.svg';document.getElementById('turn').textContent=p.turn;const notes=document.getElementById('notes');notes.textContent=p.notes.join('\n');notes.hidden=!p.notes.length;document.getElementById('lines').textC
